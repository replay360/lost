<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات الذكاء الاصطناعي</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; }
        .chat-box { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        #responseArea { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 5px; min-height: 50px; text-align: right; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="chat-box">
    <h2>تحدث مع الذكاء الاصطناعي</h2>
    <textarea id="userInput" placeholder="اكتب سؤالك هنا..."></textarea>
    <button onclick="sendToAI()">إرسال</button>
    
    <div id="responseArea">الرد سيظهر هنا...</div>
</div>

<script>
async function sendToAI() {
    const userMessage = document.getElementById("userInput").value;
    const responseArea = document.getElementById("responseArea");

    if (!userMessage.trim()) {
        alert("يرجى كتابة سؤالك أولاً!");
        return;
    }

    responseArea.innerText = "جاري التفكير والأجابة...";

    // رابط الـ Worker الحقيقي الخاص بك مقترن مباشرةً
    const WORKER_URL = "https://lively-wind-5aff.ingtra0977.workers.dev";

    try {
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ prompt: userMessage })
        });

        const data = await response.json();

        if (response.ok) {
            responseArea.innerText = data.response;
        } else {
            responseArea.innerText = "خطأ: " + (data.error || "حدث خطأ غير معروف");
        }
    } catch (err) {
        responseArea.innerText = "حدث خطأ في الاتصال بالسيرفر: " + err.message;
    }
}
</script>

</body>
</html>
