<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Buzz للدردشة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #ff5722;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #ccc;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2c2c2c;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #ff5722;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.3s, opacity 0.3s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-signup {
            background-color: #ff5722;
            color: white;
        }
        .btn-login {
            background-color: #2196F3;
            color: white;
        }
        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .alert-error {
            background-color: #5a1e1e;
            color: #ff8a8a;
            border: 1px solid #882222;
        }
        .alert-success {
            background-color: #1e4a23;
            color: #8aff9e;
            border: 1px solid #228833;
        }
        
        /* تصميم شاشة الدردشة */
        #chatScreen {
            display: none;
            text-align: right;
        }
        .chat-box {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            height: 250px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: right;
        }
        .message-row {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            margin: 0;
        }
        .chat-input-area button {
            margin: 0;
            width: 100px;
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. شاشة تسجيل الدخول وإنشاء الحساب -->
        <div class="card" id="authCard">
            <h2>تطبيق Buzz ⚡</h2>
            
            <div id="alertBox" class="alert"></div>

            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@mail.com">
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="6 أحرف أو أرقام على الأقل">
            </div>

            <button id="loginBtn" class="btn-login">تسجيل الدخول</button>
            <button id="signupBtn" class="btn-signup">إنشاء حساب جديد</button>
        </div>

        <!-- 2. شاشة غرفة الدردشة (تظهر بعد الدخول بنجاح) -->
        <div class="card" id="chatScreen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0;">غرفة الدردشة 💬</h2>
                <button id="logoutBtn" style="width: auto; padding: 6px 12px; margin: 0; background-color: #d32f2f; font-size: 13px;">خروج</button>
            </div>
            
            <p id="userWelcome" style="color: #aaa; font-size: 13px; margin-top: 0; margin-bottom: 10px;"></p>
            
            <!-- صندوق عرض الرسائل -->
            <div class="chat-box" id="chatBox">
                <div class="message-row" style="color: #888;">أهلاً بك في تطبيق Buzz! ابدأ بإرسال رسالتك الأولى...</div>
            </div>

            <!-- إرسال رسالة -->
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="اكتب رسالة...">
                <button id="sendBtn">إرسال</button>
            </div>
        </div>
    </div>

    <!-- كود ربط الفايربيس والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // إعدادات مشروعك الرسمية
        const firebaseConfig = {
            apiKey: "AIzaSyDUXP5zndjshNQhvEhTSmoS0mqBiWjp0Kc",
            authDomain: "buzz-52d7e.firebaseapp.com",
            projectId: "buzz-52d7e",
            storageBucket: "buzz-52d7e.firebasestorage.app",
            messagingSenderId: "14074681805",
            appId: "1:14074681805:web:97dc13cc92089989e24c84"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // عناصر واجهة المستخدم
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const alertBox = document.getElementById('alertBox');
        
        const authCard = document.getElementById('authCard');
        const chatScreen = document.getElementById('chatScreen');
        const userWelcome = document.getElementById('userWelcome');
        const logoutBtn = document.getElementById('logoutBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatBox = document.getElementById('chatBox');

        let currentUser = null;

        function showAlert(message, isError = true) {
            alertBox.style.display = 'block';
            alertBox.textContent = message;
            alertBox.className = isError ? 'alert alert-error' : 'alert alert-success';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
        }

        function setLoading(loading) {
            loginBtn.disabled = loading;
            signupBtn.disabled = loading;
            loginBtn.textContent = loading ? 'جاري المعالجة...' : 'تسجيل الدخول';
            signupBtn.textContent = loading ? 'جاري المعالجة...' : 'إنشاء حساب جديد';
        }

        function handleAuthError(error) {
            console.error(error);
            switch (error.code) {
                case 'auth/email-already-in-use':
                    showAlert('هذا البريد مستخدم بالفعل! سجل دخول به.');
                    break;
                case 'auth/invalid-email':
                    showAlert('صيغة البريد الإلكتروني غير صحيحة.');
                    break;
                case 'auth/weak-password':
                    showAlert('كلمة المرور ضعيفة (6 خانات على الأقل).');
                    break;
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    showAlert('البريد الإلكتروني أو كلمة المرور غير صحيحة.');
                    break;
                case 'auth/quota-exceeded':
                case 'auth/too-many-requests':
                    showAlert('تم حظر المحاولات مؤقتاً. انتظر دقيقة وجرب مجدداً.');
                    break;
                default:
                    showAlert('حدث خطأ: ' + error.message);
            }
        }

        // الانتقال لشاشة الشات عند نجاح الدخول
        function goToChat(user) {
            currentUser = user;
            authCard.style.display = 'none';
            chatScreen.style.display = 'block';
            userWelcome.textContent = "المستخدم: " + user.email;
        }

        // تسجيل الدخول
        loginBtn.addEventListener('click', async () => {
            hideAlert();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showAlert('يرجى إدخال البريد وكلمة المرور.');
                return;
            }

            setLoading(true);
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                goToChat(userCredential.user);
            } catch (error) {
                handleAuthError(error);
            } finally {
                setLoading(false);
            }
        });

        // إنشاء حساب جديد
        signupBtn.addEventListener('click', async () => {
            hideAlert();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showAlert('يرجى إدخال البريد وكلمة المرور.');
                return;
            }

            if (password.length < 6) {
                showAlert('كلمة المرور يجب أن تكون 6 خانات على الأقل.');
                return;
            }

            setLoading(true);
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                goToChat(userCredential.user);
            } catch (error) {
                handleAuthError(error);
            } finally {
                setLoading(false);
            }
        });

        // زر إرسال رسالة (تجريبي محلي حالياً)
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (!text) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-row';
            msgDiv.innerHTML = `<b style="color: #2196F3;">${currentUser.email.split('@')[0]}:</b> ${text}`;
            chatBox.appendChild(msgDiv);
            
            messageInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // زر تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            chatScreen.style.display = 'none';
            authCard.style.display = 'block';
            passwordInput.value = '';
            hideAlert();
        });
    </script>
</body>
</html>
