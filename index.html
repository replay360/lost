<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة X-O أونلاين</title>
  <script src="https://23171154b8bd7733-37-238-212-143.serveousercontent.com"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00e676; }
    .controls { margin-bottom: 20px; }
    input, button {
      padding: 10px 15px;
      font-size: 16px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }
    button {
      background-color: #00e676;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #00c853; }
    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }
    .cell {
      width: 100px;
      height: 100px;
      background-color: #1e1e1e;
      border: 2px solid #333;
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .cell:hover { background-color: #2a2a2a; }
    #status { font-size: 18px; margin-top: 15px; color: #ffeb3b; }
  </style>
</head>
<body>

  <h1>لعبة X - O أونلاين 🎮</h1>

  <div class="controls">
    <button onclick="createRoom()">إنشاء غرفة جديدة</button>
    <br><br>
    <input type="text" id="roomIdInput" placeholder="أدخل رمز الغرفة">
    <button onclick="joinRoom()">انضمام للغرفة</button>
  </div>

  <h2 id="roomDisplay"></h2>
  <div id="board" style="display:none;">
    <div class="cell" onclick="makeMove(0)"></div>
    <div class="cell" onclick="makeMove(1)"></div>
    <div class="cell" onclick="makeMove(2)"></div>
    <div class="cell" onclick="makeMove(3)"></div>
    <div class="cell" onclick="makeMove(4)"></div>
    <div class="cell" onclick="makeMove(5)"></div>
    <div class="cell" onclick="makeMove(6)"></div>
    <div class="cell" onclick="makeMove(7)"></div>
    <div class="cell" onclick="makeMove(8)"></div>
  </div>

  <div id="status"></div>

  <script>
    // الربط التلقائي بالسيرفر المباشر عن طريق Serveo
    const socket = io('https://6cdb581225716dab-37-238-212-143.serveousercontent.com');

    let currentRoom = null;
    let mySymbol = null;

    socket.on('connect', () => {
      console.log('تم الاتصال بالسيرفر بنجاح!');
    });

    function createRoom() {
      socket.emit('createRoom');
    }

    function joinRoom() {
      const roomId = document.getElementById('roomIdInput').value.trim().toUpperCase();
      if (roomId) {
        socket.emit('joinRoom', roomId);
      }
    }

    socket.on('roomCreated', (data) => {
      currentRoom = data.roomId;
      mySymbol = data.symbol;
      document.getElementById('roomDisplay').innerText = `رمز الغرفة: ${currentRoom} (أنت ${mySymbol})`;
      document.getElementById('status').innerText = 'بانتظار انضمام اللاعب الثاني...';
    });

    socket.on('gameStart', (data) => {
      currentRoom = data.roomId;
      document.getElementById('board').style.display = 'grid';
      const playerObj = data.players.find(p => p.id === socket.id);
      if (playerObj) mySymbol = playerObj.symbol;

      document.getElementById('roomDisplay').innerText = `الغرفة: ${currentRoom} | دور: ${data.turn}`;
      document.getElementById('status').innerText = `بدأت اللعبة! رمزك هو (${mySymbol})`;
    });

    function makeMove(index) {
      if (currentRoom) {
        socket.emit('makeMove', { roomId: currentRoom, index });
      }
    }

    socket.on('moveMade', (data) => {
      const cells = document.querySelectorAll('.cell');
      data.board.forEach((val, idx) => {
        cells[idx].innerText = val || '';
      });

      if (data.winner) {
        document.getElementById('status').innerText = `🎉 الفائز هو اللاعب (${data.winner})!`;
      } else if (data.isDraw) {
        document.getElementById('status').innerText = '🤝 تعادل!';
      } else {
        document.getElementById('status').innerText = `دور اللاعب: (${data.nextTurn})`;
      }
    });

    socket.on('errorMsg', (msg) => {
      alert(msg);
    });
  </script>
</body>
</html>
