<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تحدي الأصدقاء</title>
    <!-- استدعاء مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        input { background: #334155; color: #fff; border: 1px solid #475569; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; }
        .hidden { display: none !important; }
        .status { text-align: center; color: #fbbf24; margin: 10px 0; font-weight: bold; }
        .score-board { display: flex; justify-content: space-between; background: #334155; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container" id="app">
    <h2>تحدي الصداقة 🤝</h2>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <input type="text" id="player-name" placeholder="أدخل اسمك الكريم...">
        <input type="text" id="room-code-input" placeholder="كود الغرفة (مثلاً: 1234)">
        <button onclick="createRoom()">إنشاء غرفة جديدة</button>
        <button onclick="joinRoom()" style="background: #10b981; color: #fff;">انضمام للغرفة</button>
    </div>

    <!-- شاشة الانتظار -->
    <div id="waiting-screen" class="hidden">
        <div class="status">بانتظار انضمام الصديق...</div>
        <p style="text-align: center;">شارك كود الغرفة مع صديقك: <span id="display-code" style="color: #38bdf8; font-weight: bold;"></span></p>
    </div>

    <!-- شاشة اللعب -->
    <div id="game-screen" class="hidden">
        <div class="score-board">
            <span id="p1-score-txt">اللاعب 1: 0</span>
            <span id="round-txt" style="color: #fbbf24;">الجولة: 1/10</span>
            <span id="p2-score-txt">اللاعب 2: 0</span>
        </div>

        <div id="question-writing-area">
            <p id="turn-instruction" style="color: #38bdf8; font-weight: bold;"></p>
            <input type="text" id="q-text" placeholder="اكتب سؤالاً عن نفسك لصديقك...">
            <input type="text" id="q-correct" placeholder="الخيار الصحيح (الجواب الصح)">
            <input type="text" id="q-wrong" placeholder="الخيار الخاطئ">
            <button onclick="submitQuestion()">إرسال السؤال وانتظار الصديق</button>
        </div>

        <div id="waiting-other-q" class="hidden status">
            تم إرسال سؤالك! بانتظار أن يرسل صديقك سؤاله أيضاً...
        </div>

        <!-- شاشة الإجابة -->
        <div id="answering-area" class="hidden">
            <h3 style="color: #f43f5e; text-align: center;">سؤال صديقك لك:</h3>
            <p id="friend-question-text" style="font-size: 18px; text-align: center; background: #334155; padding: 10px; border-radius: 6px;"></p>
            <button id="opt1" onclick="answerQuestion(this.innerText)"></button>
            <button id="opt2" onclick="answerQuestion(this.innerText)"></button>
        </div>
        
        <div id="waiting-result" class="hidden status">
            جاري انتظار إجابة الطرف الآخر لننتقل للجولة التالية...
        </div>
    </div>

    <!-- شاشة النهاية -->
    <div id="finish-screen" class="hidden">
        <h2>انتهت اللعبة! 🎉</h2>
        <p id="final-result-text" style="text-align: center; font-size: 18px;"></p>
        <button onclick="location.reload()">لعب من جديد</button>
    </div>
</div>

<script>
    // إعدادات الاتصال بـ Supabase مع المفتاح الحقيقي الخاص بك
    const SUPABASE_URL = 'https://mkwqnhvhixjipgxchfnr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rd3FuaHZoaXhqaXBneGNoZm5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDU3MTcsImV4cCI6MjEwNzE4MTcxN30.h19KvBWGOyv2OOZAEcJPJ68YeQTxL6wdTyowN2WN66E';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myName = '';
    let roomCode = '';
    let myRole = ''; 
    let currentRound = 1;

    async function createRoom() {
        myName = document.getElementById('player-name').value.trim();
        roomCode = document.getElementById('room-code-input').value.trim();
        if(!myName || !roomCode) { alert('يرجى كتابة الاسم وكود الغرفة'); return; }

        myRole = 'player1';
        const { error } = await supabaseClient.from('rooms').insert([
            { room_code: roomCode, player1: myName, current_round: 1, player1_score: 0, player2_score: 0 }
        ]);

        if(error) { alert('حدث خطأ، ربما الكود مستخدم مسبقاً: ' + error.message); return; }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('waiting-screen').classList.remove('hidden');
        document.getElementById('display-code').innerText = roomCode;

        listenForRoomUpdates();
    }

    async function joinRoom() {
        myName = document.getElementById('player-name').value.trim();
        roomCode = document.getElementById('room-code-input').value.trim();
        if(!myName || !roomCode) { alert('يرجى كتابة الاسم وكود الغرفة'); return; }

        myRole = 'player2';
        const { data, error } = await supabaseClient.from('rooms').select('*').eq('room_code', roomCode).single();
        
        if(error || !data) { alert('الغرفة غير موجودة!'); return; }

        await supabaseClient.from('rooms').update({ player2: myName }).eq('room_code', roomCode);

        document.getElementById('login-screen').classList.add('hidden');
        startGameScreen(data);
        listenForRoomUpdates();
    }

    function listenForRoomUpdates() {
        supabaseClient.channel('room-changes-' + roomCode)
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `room_code=eq.${roomCode}` }, payload => {
                startGameScreen(payload.new);
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'questions', filter: `room_code=eq.${roomCode}` }, payload => {
                checkRoundStatus();
            })
            .subscribe();
    }

    function startGameScreen(roomData) {
        if(roomData.player2 && document.getElementById('waiting-screen').classList.contains('hidden') === false) {
            document.getElementById('waiting-screen').classList.add('hidden');
        }
        if(!roomData.player2) return; 

        document.getElementById('game-screen').classList.remove('hidden');
        currentRound = roomData.current_round;
        document.getElementById('round-txt').innerText = `الجولة: ${currentRound}/10`;
        document.getElementById('p1-score-txt').innerText = `${roomData.player1}: ${roomData.player1_score}`;
        document.getElementById('p2-score-txt').innerText = `${roomData.player2}: ${roomData.player2_score}`;

        if(currentRound > 10) {
            showFinalResult(roomData);
            return;
        }

        prepareRound();
    }

    async function prepareRound() {
        const { data } = await supabaseClient.from('questions').select('*').eq('room_code', roomCode).eq('round', currentRound);
        
        let myQuestionSent = data.some(q => q.sender === myName);
        
        if(!myQuestionSent) {
            document.getElementById('question-writing-area').classList.remove('hidden');
            document.getElementById('waiting-other-q').classList.add('hidden');
            document.getElementById('answering-area').classList.add('hidden');
            document.getElementById('turn-instruction').innerText = `الجولة ${currentRound}: اكتب سؤالاً عن نفسك`;
        } else {
            document.getElementById('question-writing-area').classList.add('hidden');
            document.getElementById('waiting-other-q').classList.remove('hidden');
        }

        if(data.length === 2) {
            document.getElementById('waiting-other-q').classList.add('hidden');
            let friendQ = data.find(q => q.sender !== myName);
            if(friendQ) {
                showAnsweringArea(friendQ);
            }
        }
    }

    async function submitQuestion() {
        const text = document.getElementById('q-text').value.trim();
        const correct = document.getElementById('q-correct').value.trim();
        const wrong = document.getElementById('q-wrong').value.trim();

        if(!text || !correct || !wrong) { alert('املأ جميع الحقول'); return; }

        await supabaseClient.from('questions').insert([
            { room_code: roomCode, round: currentRound, sender: myName, question_text: text, correct_answer: correct, wrong_answer: wrong }
        ]);

        document.getElementById('q-text').value = '';
        document.getElementById('q-correct').value = '';
        document.getElementById('q-wrong').value = '';

        prepareRound();
    }

    function showAnsweringArea(qData) {
        document.getElementById('answering-area').classList.remove('hidden');
        document.getElementById('friend-question-text').innerText = qData.question_text;

        let options = [qData.correct_answer, qData.wrong_answer];
        options.sort(() => Math.random() - 0.5);

        document.getElementById('opt1').innerText = options[0];
        document.getElementById('opt2').innerText = options[1];
        window.currentQData = qData;
    }

    async function answerQuestion(chosenAnswer) {
        document.getElementById('answering-area').classList.add('hidden');
        document.getElementById('waiting-result').classList.remove('hidden');

        let isCorrect = (chosenAnswer === window.currentQData.correct_answer);
        
        const { data: roomData } = await supabaseClient.from('rooms').select('*').eq('room_code', roomCode).single();
        
        let scoreField = (myRole === 'player1') ? 'player1_score' : 'player2_score';
        let currentScore = (myRole === 'player1') ? roomData.player1_score : roomData.player2_score;
        
        let updateObj = {};
        if(isCorrect) {
            updateObj[scoreField] = currentScore + 1;
        }

        let choiceField = (myRole === 'player1') ? 'player1_choice' : 'player2_choice';
        let tempObj = {};
        tempObj[choiceField] = chosenAnswer;
        await supabaseClient.from('questions').update(tempObj).eq('id', window.currentQData.id);

        if(Object.keys(updateObj).length > 0) {
            await supabaseClient.from('rooms').update(updateObj).eq('room_code', roomCode);
        }

        setTimeout(async () => {
            if(myRole === 'player1') {
                await supabaseClient.from('rooms').update({ current_round: currentRound + 1 }).eq('room_code', roomCode);
            }
        }, 1500);
    }

    async function checkRoundStatus() {
        prepareRound();
    }

    function showFinalResult(roomData) {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('finish-screen').classList.remove('hidden');

        let resText = `نتيجة اللعبة:<br>${roomData.player1}: ${roomData.player1_score} نقاط<br>${roomData.player2}: ${roomData.player2_score} نقاط<br><br>`;
        if(roomData.player1_score > roomData.player2_score) {
            resText += `الفائز هو ${roomData.player1} 🏆`;
        } else if(roomData.player2_score > roomData.player1_score) {
            resText += `الفائز هو ${roomData.player2} 🏆`;
        } else {
            resText += `تعادل! 🤝`;
        }
        document.getElementById('final-result-text').innerHTML = resText;
    }
</script>

</body>
</html>
