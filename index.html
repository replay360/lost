<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Globle ♾️ خمّن الدولة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:#0b0b0b;min-height:100vh;
  background:linear-gradient(180deg,#d9f3fb 0%,#8fd4ee 14%,#cfeaf1 34%,#c3dccd 60%,#e3e4c4 82%,#f9ecd2 100%) fixed;
}
#app{max-width:520px;margin:0 auto;padding:0 20px 60px}
header{direction:ltr;text-align:center;padding-top:6px}
h1{font-size:58px;line-height:1;margin:6px 0 0;font-weight:800;letter-spacing:-1px;font-family:'Cairo',system-ui,sans-serif}
.bar{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #000;height:56px;position:relative;margin-top:2px}
.bar .l,.bar .r{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.ib{background:none;border:0;padding:2px;cursor:pointer;color:#000;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}
.ib svg{width:30px;height:30px}
.inf{position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;width:56px;height:56px;border-radius:13px;background:linear-gradient(145deg,#b44fd0,#8d2fa8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:800;line-height:1;box-shadow:inset 0 2px 3px rgba(255,255,255,.35)}
#roomBar{margin-top:14px;background:rgba(255,255,255,.7);border-radius:12px;padding:8px 12px;font-size:15px;cursor:pointer;border:1px solid rgba(0,0,0,.08)}
#roomBar .t{font-weight:700}
#roomBar .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;color:#fff;font-size:13px;font-weight:600}
.inputRow{direction:ltr;display:flex;align-items:center;gap:14px;margin-top:38px}
#inp{flex:1;min-width:0;height:48px;border:1px solid #d8d8d8;border-radius:8px;padding:0 12px;font:inherit;font-size:20px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);outline:none;direction:rtl;text-align:right}
#inp:focus{box-shadow:0 0 0 3px rgba(240,160,60,.55)}
#inp:disabled{opacity:.6}
#bEnter{background:none;border:0;color:#fff;font:inherit;font-weight:800;font-size:22px;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.35);padding:6px 4px;min-width:64px}
#turnBar{margin-top:12px;border-radius:12px;padding:8px 12px;text-align:center;font-size:20px;font-weight:800;background:rgba(255,255,255,.7)}
#turnBar.mine{background:#c8f2cf;box-shadow:0 0 0 2px #3aa55a}
#msg{min-height:26px;margin-top:8px;font-size:16px;font-weight:600;color:#7a1d1d;text-align:center}
#msg.ok{color:#1c5c2b}
#globeWrap{position:relative;width:100%;margin-top:6px;aspect-ratio:1/1;user-select:none;-webkit-user-select:none}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#tip{position:absolute;pointer-events:none;background:rgba(10,20,35,.88);color:#fff;padding:5px 14px;border-radius:10px;font-weight:700;font-size:20px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .25s;z-index:5}
#tip.on{opacity:1}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;text-align:center;padding:20px;z-index:6}
#loading button{font:inherit;padding:8px 18px;border-radius:10px;border:1px solid #e08a2e;background:#f7bd62;cursor:pointer;font-weight:700}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(0,0,0,.15);border-top-color:#2a7bc9;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.zoom{display:flex;justify-content:space-between;direction:ltr;margin-top:10px}
.zb{width:60px;height:38px;border-radius:10px;border:2px solid #f0883e;background:#f7bd62;font-size:24px;font-weight:700;cursor:pointer;color:#111;line-height:1;padding:0}
.zb:active{transform:scale(.94)}
#banner{margin-top:22px;border-radius:16px;padding:16px;text-align:center;background:rgba(255,255,255,.8);box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:20px;font-weight:700}
#banner small{display:block;font-size:15px;font-weight:600;color:#444;margin-top:4px}
.btn{font:inherit;font-weight:700;padding:9px 18px;border-radius:12px;border:2px solid #e08a2e;background:#f7bd62;cursor:pointer;color:#111;font-size:17px}
.btn.alt{background:#fff;border-color:#bbb}
.btn.red{background:#f6b4b4;border-color:#d96a6a}
.btn:disabled{opacity:.5}
#banner .btn{margin-top:12px}
h2{font-size:30px;margin:34px 0 8px;font-weight:800}
.row{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:24px}
.row .fl{font-size:30px;line-height:1;width:44px;text-align:center;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ds{font-size:17px;font-weight:700;padding:2px 10px;border-radius:99px;color:#222;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);white-space:nowrap;direction:rtl}
.row .by{font-size:12px;color:#fff;padding:1px 8px;border-radius:99px;font-weight:600}
#last{margin-top:24px;font-size:24px;font-weight:600}
#cnt{margin-top:6px;font-size:16px;color:#444}
#giveup{margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.card{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.card h3{margin:0 0 14px;font-size:26px;font-weight:800}
.card .x{position:absolute;top:10px;left:12px;border:0;background:none;font-size:26px;cursor:pointer;color:#555}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-size:18px}
.set input[type=checkbox]{width:24px;height:24px}
.set select,.card input[type=text]{font:inherit;font-size:18px;padding:7px 10px;border-radius:10px;border:1px solid #ccc;min-width:0}
.card input[type=text]{width:100%}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:#f3f7fa;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px}
.pl{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eee;font-size:19px}
.pl .sc{margin-inline-start:auto;font-weight:800}
.code{font-size:40px;font-weight:800;letter-spacing:6px;text-align:center;direction:ltr;background:#f3f7fa;border-radius:14px;padding:8px;cursor:pointer}
.sub{font-size:14px;color:#666;margin:6px 0 12px}
.fr{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.fr .btn{flex:1}
.ltr{direction:ltr}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Globle</h1>
    <div class="bar">
      <div class="l"><button class="ib" id="bNew" title="لعبة جديدة"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg></button></div>
      <div class="inf">∞</div>
      <div class="r">
        <button class="ib" id="bNet" title="أونلاين">🌐</button>
        <button class="ib" id="bStats" title="الإحصائيات"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="11" width="5" height="9"/><rect x="9.5" y="3" width="5" height="17"/><rect x="16" y="8" width="5" height="12"/></svg></button>
        <button class="ib" id="bSet" title="الإعدادات"><svg viewBox="0 0 24 24" fill="#000"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
      </div>
    </div>
  </header>

  <div id="roomBar" hidden></div>

  <div class="inputRow">
    <input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="اسم الدولة">
    <button id="bEnter">إدخال</button>
  </div>
  <div id="turnBar" hidden></div>
  <div id="msg"></div>

  <div id="globeWrap">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="loading"><div class="spin"></div><div>جاري تحميل الخريطة…</div></div>
  </div>
  <div class="zoom"><button class="zb" id="zOut">-</button><button class="zb" id="zIn">+</button></div>

  <div id="banner" hidden></div>

  <section>
    <h2>الأقرب</h2>
    <div id="list"></div>
    <div id="last"></div>
    <div id="cnt"></div>
    <button class="btn alt" id="giveup" hidden>استسلام 🏳️</button>
  </section>
</div>

<div class="modal" id="mSet" hidden><div class="card"><button class="x">✕</button><h3>الإعدادات</h3>
  <div class="set"><span>إظهار حدود الدول</span><input type="checkbox" id="sBorders"></div>
  <div class="set"><span>تضمين الدول الصغيرة جداً (صعب)</span><input type="checkbox" id="sSmall"></div>
  <div class="set"><span>المسافة بالأميال</span><input type="checkbox" id="sMiles"></div>
  <div class="set"><span>سيرفر الأونلاين</span><select id="sServer"></select></div>
  <div class="set" style="display:block"><div style="margin-bottom:6px">اسمك باللعب الأونلاين</div><input type="text" id="sName" maxlength="14"></div>
  <div class="sub">دوس على أي دولة بالكوكب وراح يطلع اسمها لثواني.</div>
</div></div>
<div class="modal" id="mStats" hidden><div class="card"><button class="x">✕</button><h3>الإحصائيات</h3><div class="stat" id="statBody"></div></div></div>
<div class="modal" id="mNet" hidden><div class="card"><button class="x">✕</button><h3>🌐 لعب أونلاين</h3><div id="netBody"></div></div></div>

    const o=new Array(a.length); let x=0,y=0;
    for(let i=0;i<a.length;i++){
      if(t){ x+=a[i][0]; y+=a[i][1]; o[i]=[x*t.scale[0]+t.translate[0], y*t.scale[1]+t.translate[1]]; }

  });

  nameIndex=[];
  countries.forEach(c=>{
    if(!c.ar) return;
    [c.ar,...c.aliases].forEach(n=>{ const k=mkey(n); if(k) nameIndex.push({k,f:fold(k),c,n}); });
  });
}
function matchGuess(text){
  const q=mkey(text);
  if(!q) return {err:'اكتب اسم دولة'};
  let hit=nameIndex.find(e=>e.k===q); if(hit) return {c:hit.c};
  const fq=fold(q);
  hit=nameIndex.find(e=>e.f===fq); if(hit) return {c:hit.c};
  // تقريبي
  const best=new Map(); let bestD=99;
  nameIndex.forEach(e=>{
    const th=e.k.length<=3?0:(e.k.length<=5?1:(e.k.length<=9?2:3));
    let d=levSimple(fq,e.f);
    if(d<=th){ const prev=best.get(e.c); if(prev===undefined||d<prev) best.set(e.c,d); if(d<bestD) bestD=d; }
  });
  if(best.size){
    const top=[...best.entries()].filter(x=>x[1]===bestD);
    if(top.length===1) return {c:top[0][0]};
    return {err:'قصدك: '+top.slice(0,3).map(x=>x[0].ar).join(' أو ')+'؟ اكتبها أوضح'};
  }
  if(q.length>=3){
    const subs=[...new Set(nameIndex.filter(e=>e.k.includes(q)||q.includes(e.k)&&e.k.length>=4).map(e=>e.c))];
    if(subs.length>1) return {err:'حدّد أكثر: '+subs.slice(0,4).map(c=>c.ar).join(' / ')};
    if(subs.length===1) return {c:subs[0]};
  }
  return {err:'ما لكيت هالدولة 🤔'};
}

function addGuess(c,by){

const cv=$('#cv'), ctx=cv.getContext('2d');
const view={lon:44,lat:28,zoom:1,size:360,dpr:1};
let hl=null, hlT=null, anim=null, needDraw=false;
function resize(){
  const w=$('#globeWrap').clientWidth; view.size=w; view.dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(w*view.dpr); cv.height=Math.round(w*view.dpr);
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0); draw();
}
function basis(){
  const l=view.lon*D2R, p=view.lat*D2R, cl=Math.cos(l), sl=Math.sin(l), cp=Math.cos(p), sp=Math.sin(p);
  return {cx:cp*cl,cy:cp*sl,cz:sp, ex:-sl,ey:cl, nx:-sp*cl,ny:-sp*sl,nz:cp};
}
let dep=new Float32Array(4096);
function clipRing(r,P,S,B,CX,CY,R){
  const v=r.v,n=r.n,ll=r.ll;
  if(dep.length<n) dep=new Float32Array(n*2);
  let vis=0;
  for(let i=0;i<n;i++){ const d=v[3*i]*B.cx+v[3*i+1]*B.cy+v[3*i+2]*B.cz; dep[i]=d; if(d>=0) vis++; }
  if(!vis) return;
  const X=i=>CX+R*(v[3*i]*B.ex+v[3*i+1]*B.ey);
  const Y=i=>CY-R*(v[3*i]*B.nx+v[3*i+1]*B.ny+v[3*i+2]*B.nz);
  const am=i=>Math.abs(ll[2*i])>=179.98;
  if(vis===n){
    P.moveTo(X(0),Y(0)); S.moveTo(X(0),Y(0));
    for(let i=1;i<n;i++){
      const x=X(i),y=Y(i); P.lineTo(x,y);
      if(am(i)&&am(i-1)) S.moveTo(x,y); else S.lineTo(x,y);
    }
    P.closePath(); return;
  }
  let s=-1;
  for(let i=0;i<n;i++){ const pi=(i-1+n)%n; if(dep[i]>=0&&dep[pi]<0){ s=i; break; } }
  if(s<0) return;
  const cross=(a,b)=>{
    const t=dep[a]/(dep[a]-dep[b]);
    let x=v[3*a]+t*(v[3*b]-v[3*a]), y=v[3*a+1]+t*(v[3*b+1]-v[3*a+1]), z=v[3*a+2]+t*(v[3*b+2]-v[3*a+2]);
    const L=Math.hypot(x,y,z)||1; x/=L; y/=L; z/=L;
    const ve=x*B.ex+y*B.ey, vn=x*B.nx+y*B.ny+z*B.nz;
    return {x:CX+R*ve,y:CY-R*vn,a:Math.atan2(vn,ve)};
  };
  const arc=(a1,a2)=>{
    let da=a2-a1; while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI;
    const steps=Math.ceil(Math.abs(da)/0.12);
    for(let m=1;m<steps;m++){ const a=a1+da*m/steps; P.lineTo(CX+R*Math.cos(a),CY-R*Math.sin(a)); }
  };
  const X0=cross((s-1+n)%n,s);
  P.moveTo(X0.x,X0.y); P.lineTo(X(s),Y(s));
  S.moveTo(X0.x,X0.y); S.lineTo(X(s),Y(s));
  let exitA=null;
  for(let k=0;k<n-1;k++){
    const i=(s+k)%n, j=(s+k+1)%n, vi=dep[i]>=0, vj=dep[j]>=0;
    if(vi&&vj){ const x=X(j),y=Y(j); P.lineTo(x,y); if(am(i)&&am(j)) S.moveTo(x,y); else S.lineTo(x,y); }
    else if(vi&&!vj){ const c=cross(i,j); P.lineTo(c.x,c.y); S.lineTo(c.x,c.y); exitA=c.a; }
    else if(!vi&&vj){ const c=cross(i,j); if(exitA!==null) arc(exitA,c.a); P.lineTo(c.x,c.y); S.moveTo(c.x,c.y); const x=X(j),y=Y(j); P.lineTo(x,y); S.lineTo(x,y); }
  }
  if(exitA!==null) arc(exitA,X0.a);
  P.closePath();
}
function draw(){
  needDraw=false;
  const W=view.size; if(!W) return;
  const R=W*0.44*view.zoom, cx=W/2, cy=W/2, B=basis();
  ctx.clearRect(0,0,W,W);
  // هالة الغلاف الجوي
  if(R<W*1.2){
    const ag=ctx.createRadialGradient(cx,cy,R*0.97,cx,cy,R*1.13);
    ag.addColorStop(0,'rgba(120,200,255,.55)'); ag.addColorStop(1,'rgba(120,200,255,0)');
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(cx,cy,R*1.13,0,7); ctx.fill();
  }
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip();
  const og=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.05,cx,cy,R);
  og.addColorStop(0,'#2f86d8'); og.addColorStop(.6,'#0f5ca8'); og.addColorStop(1,'#073a70');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,W);
  if(loaded){
    ctx.lineJoin='round';
    const target=G.revealed?byKey[G.target]:null;
    for(const C of countries){
      const P=new Path2D(), Sp=new Path2D();
      let any=false;
      for(const p of C.polys){
        const dd=p.cap[0]*B.cx+p.cap[1]*B.cy+p.cap[2]*B.cz;
        if(dd<-Math.sin(Math.min(1.5,p.rho))-0.005 && p.rho<1.55) continue;
        if(p.rho*R<0.35) continue;
        any=true;
        for(const r of p.rings) clipRing(r,P,Sp,B,cx,cy,R);
      }
      if(!any) continue;
      let fill=C.terrain, guessed=guessMap.has(C.key);
      if(guessed) fill=colorFor(guessMap.get(C.key));
      if(target&&C===target) fill='#2fbf5b';
      ctx.fillStyle=fill; ctx.fill(P,'evenodd');
      if(C===hl){ ctx.fillStyle='rgba(255,255,255,.28)'; ctx.fill(P,'evenodd'); }
      if(S.borders||guessed||C===hl){
        ctx.lineWidth=C===hl?2.6:(guessed?1:0.7);
        ctx.strokeStyle=C===hl?'#fff':(guessed?'rgba(70,25,0,.55)':'rgba(255,255,255,.55)');
        ctx.stroke(Sp);
      }
    }
    // علامات للدول الصغيرة
    const mark=(C,color)=>{
      if(C.rhoMax*R>=5) return;
      const d=C.capVec[0]*B.cx+C.capVec[1]*B.cy+C.capVec[2]*B.cz; if(d<0.04) return;
      const x=cx+R*(C.capVec[0]*B.ex+C.capVec[1]*B.ey), y=cy-R*(C.capVec[0]*B.nx+C.capVec[1]*B.ny+C.capVec[2]*B.nz);
      ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fillStyle=color; ctx.fill(); ctx.lineWidth=1.8; ctx.strokeStyle='#2b1400'; ctx.stroke();
    };
    guessMap.forEach((d,k)=>{ const C=byKey[k]; if(C) mark(C,(target&&C===target)?'#2fbf5b':colorFor(d)); });
    if(target&&!guessMap.has(target.key)) mark(target,'#2fbf5b');
  }
  const sh=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);
  sh.addColorStop(0,'rgba(255,255,255,.2)'); sh.addColorStop(.55,'rgba(255,255,255,0)'); sh.addColorStop(1,'rgba(0,12,45,.5)');
  ctx.fillStyle=sh; ctx.fillRect(0,0,W,W);
  ctx.restore();
}
function reqDraw(){ if(!needDraw){ needDraw=true; requestAnimationFrame(draw); } }
function flyTo(lon,lat){
  const from={lon:view.lon,lat:view.lat};
  let dl=lon-from.lon; while(dl>180) dl-=360; while(dl<-180) dl+=360;
  const to={lon:from.lon+dl,lat:Math.max(-70,Math.min(70,lat))};
  const t0=performance.now(), dur=850; const id=Symbol(); anim=id;
  (function step(now){
    if(anim!==id) return;
    let t=Math.min(1,(now-t0)/dur); t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    view.lon=from.lon+(to.lon-from.lon)*t; view.lat=from.lat+(to.lat-from.lat)*t;
    draw(); if(t<1) requestAnimationFrame(step);
  })(t0);
}
function setZoom(z){ view.zoom=Math.max(0.8,Math.min(9,z)); reqDraw(); }

/* تفاعل اللمس */
const ptrs=new Map(); let drag=null, pinch=0;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); anim=null;
  if(ptrs.size===1) drag={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch=Math.hypot(a.x-b.x,a.y-b.y); drag=null; }
  cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch>0) setZoom(view.zoom*d/pinch); pinch=d; return;
  }
  if(!drag) return;
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  const k=0.32/view.zoom;
  view.lon-=dx*k; view.lat=Math.max(-85,Math.min(85,view.lat+dy*k));
  while(view.lon>180) view.lon-=360; while(view.lon<-180) view.lon+=360;
  reqDraw();
});
function endPtr(e){
  const had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId); cv.style.cursor='grab';
  if(had&&drag&&ptrs.size===0&&drag.moved<9&&performance.now()-drag.t<600) tap(e.clientX,e.clientY);
  if(ptrs.size<2) pinch=0; if(ptrs.size===0) drag=null;
}
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{ e.preventDefault(); setZoom(view.zoom*Math.exp(-e.deltaY*0.0015)); },{passive:false});

function pip(poly,lon,lat){
  const b=poly.bb; if(lon<b[0]||lon>b[2]||lat<b[1]||lat>b[3]) return false;
  let inside=false;
  for(const r of poly.rings){
    const ll=r.ll,n=r.n;
    for(let i=0,j=n-1;i<n;j=i++){
      const xi=ll[2*i],yi=ll[2*i+1],xj=ll[2*j],yj=ll[2*j+1];
      if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
    }
  }
  return inside;
}
function tap(px,py){
  if(!loaded) return;
  const rc=cv.getBoundingClientRect(), x=px-rc.left, y=py-rc.top;
  const W=view.size, R=W*0.44*view.zoom, cx=W/2, cy=W/2, B=basis();
  const sx=(x-cx)/R, sy=(cy-y)/R, r2=sx*sx+sy*sy;
  let found=null;
  if(r2<=1){
    const sz=Math.sqrt(1-r2);
    const vx=sx*B.ex+sy*B.nx+sz*B.cx, vy=sx*B.ey+sy*B.ny+sz*B.cy, vz=sy*B.nz+sz*B.cz;
    const lat=Math.asin(Math.max(-1,Math.min(1,vz)))*R2D, lon=Math.atan2(vy,vx)*R2D;
    outer: for(const C of countries){
      for(const p of C.polys) if(pip(p,lon,lat)){ found=C; break outer; }
    }
    if(!found){
      // دول صغيرة: أقرب علامة
      let bd=16;
      for(const C of countries){
        if(C.rhoMax*R>=12) continue;
        const d=C.capVec[0]*B.cx+C.capVec[1]*B.cy+C.capVec[2]*B.cz; if(d<0.04) continue;
        const X=cx+R*(C.capVec[0]*B.ex+C.capVec[1]*B.ey), Y=cy-R*(C.capVec[0]*B.nx+C.capVec[1]*B.ny+C.capVec[2]*B.nz);
        const dd=Math.hypot(X-x,Y-y); if(dd<bd){ bd=dd; found=C; }
      }
    }
  }
  const tip=$('#tip');
  if(found&&found.ar){
    hl=found; clearTimeout(hlT);
    tip.textContent=found.ar; tip.style.left=Math.max(50,Math.min(W-50,x))+'px'; tip.style.top=Math.max(40,y-14)+'px'; tip.classList.add('on');
    hlT=setTimeout(()=>{ tip.classList.remove('on'); hl=null; draw(); },2300);
    draw();
  } else { tip.classList.remove('on'); hl=null; draw(); }
}

/* ====================== MQTT صغير (بدون مكتبات) ====================== */
class MiniMQTT{
  constructor(){ this.ws=null; this.buf=new Uint8Array(0); this.pid=1; this.onmessage=null; this.onclose=null; this.pingT=null; this.closed=false; }
  _str(s){ const b=new TextEncoder().encode(s); const o=new Uint8Array(2+b.length); o[0]=b.length>>8; o[1]=b.length&255; o.set(b,2); return o; }
  _len(n){ const o=[]; do{ let d=n%128; n=Math.floor(n/128); if(n>0) d|=128; o.push(d); }while(n>0); return o; }
  _pkt(first,body){ const l=this._len(body.length); const o=new Uint8Array(1+l.length+body.length); o[0]=first; o.set(l,1); o.set(body,1+l.length); return o; }
  _cat(...a){ const n=a.reduce((s,x)=>s+x.length,0); const o=new Uint8Array(n); let p=0; a.forEach(x=>{ o.set(x,p); p+=x.length; }); return o; }
  connect(url,clientId,timeout){
    timeout=timeout||8000;
    return new Promise((resolve,reject)=>{
      let done=false, ws;
      try{ ws=new WebSocket(url,'mqtt'); }catch(e){ reject(e); return; }
      ws.binaryType='arraybuffer'; this.ws=ws;
      const timer=setTimeout(()=>{ if(!done){ done=true; try{ws.close();}catch(e){} reject(new Error('timeout')); } },timeout);
      ws.onopen=()=>{
        const vh=this._cat(Uint8Array.from([0,4,77,81,84,84,4,2,0,30]),this._str(clientId));
        ws.send(this._pkt(0x10,vh));
      };
      ws.onerror=()=>{ if(!done){ done=true; clearTimeout(timer); reject(new Error('ws')); } };
      ws.onclose=()=>{ clearInterval(this.pingT); if(!done){ done=true; clearTimeout(timer); reject(new Error('closed')); } else if(!this.closed&&this.onclose) this.onclose(); };
      ws.onmessage=ev=>this._feed(new Uint8Array(ev.data));
      this._connack=code=>{
        if(done) return; done=true; clearTimeout(timer);
        if(code===0){ this.pingT=setInterval(()=>{ try{ this.ws.send(Uint8Array.from([0xC0,0])); }catch(e){} },20000); resolve(); }
        else reject(new Error('refused '+code));
      };
    });
  }
  _feed(chunk){
    this.buf=this._cat(this.buf,chunk);
    for(;;){
      const b=this.buf; if(b.length<2) return;
      let i=1,mul=1,len=0,x;
      do{ if(i>=b.length) return; x=b[i++]; len+=(x&127)*mul; mul*=128; }while(x&128);
      if(b.length<i+len) return;
      const first=b[0], body=b.slice(i,i+len); this.buf=b.slice(i+len);
      const type=first>>4;
      if(type===2){ this._connack&&this._connack(body[1]); }
      else if(type===3){
        const tl=(body[0]<<8)|body[1], topic=new TextDecoder().decode(body.slice(2,2+tl));
        let off=2+tl; const qos=(first>>1)&3; if(qos>0) off+=2;
        const payload=new TextDecoder().decode(body.slice(off));
        if(this.onmessage) this.onmessage(topic,payload);
      }
    }
  }
  subscribe(topic){
    const id=this.pid; this.pid=this.pid%65535+1;
    this.ws.send(this._pkt(0x82,this._cat(Uint8Array.from([id>>8,id&255]),this._str(topic),Uint8Array.from([0]))));
  }
  publish(topic,msg){
    if(!this.ws||this.ws.readyState!==1) return false;
    this.ws.send(this._pkt(0x30,this._cat(this._str(topic),new TextEncoder().encode(msg)))); return true;
  }
  close(){ this.closed=true; clearInterval(this.pingT); try{ this.ws.send(Uint8Array.from([0xE0,0])); }catch(e){} try{ this.ws.close(); }catch(e){} }
}

/* ====================== الأونلاين ====================== */
const NET={mq:null,room:null,id:rid(8),joined:0,peers:new Map(),names:{},scores:{},round:0,active:false,
  status:'off',token:0,timer:null,tt:null,winSent:false,srv:'',turn:{k:0,id:null,last:null,dl:0,at:0},lastTurnSend:0};
const TURN_MS=15000;
const TOP=()=>TOPIC_PREFIX+NET.room;
function netSend(o){ try{ return NET.mq&&NET.mq.publish(TOP(),JSON.stringify(o)); }catch(e){ return false; } }
function alivePeers(){
  const now=Date.now(), out=[];
  NET.peers.forEach((p,id)=>{ if(id===NET.id||now-p.seen<26000) out.push([id,p]); });
  return out;
}
function hostId(){
  const a=alivePeers().sort((x,y)=>(x[1].joined-y[1].joined)||(x[0]<y[0]?-1:1));
  return a.length?a[0][0]:NET.id;
}
function amHost(){ return G.mode==='online'&&hostId()===NET.id; }
function touchPeer(id,name,joined){
  if(!id) return;
  const p=NET.peers.get(id)||{};
  p.name=String(name||p.name||'لاعب').slice(0,14); p.joined=Number(joined)||p.joined||Date.now(); p.seen=Date.now();
  NET.peers.set(id,p); NET.names[id]=p.name;
}
function sendHello(){ touchPeer(NET.id,S.name,NET.joined); netSend({t:'hello',id:NET.id,n:S.name,j:NET.joined}); }
function sendPing(){ touchPeer(NET.id,S.name,NET.joined); netSend({t:'ping',id:NET.id,n:S.name,j:NET.joined}); }

async function openLink(token){
  for(let k=0;k<SERVERS.length;k++){
    if(token!==NET.token) return false;
    const idx=(S.server+k)%SERVERS.length;
    const mq=new MiniMQTT();
    try{ await mq.connect(SERVERS[idx][1],'gba-'+NET.id+'-'+rid(4)); }catch(e){ continue; }
    if(token!==NET.token){ mq.close(); return false; }
    NET.mq=mq; NET.srv=SERVERS[idx][0];
    mq.onmessage=onNetMsg;
    mq.onclose=()=>{ if(NET.mq===mq&&token===NET.token) onNetClose(token); };
    mq.subscribe(TOP());
    return true;
  }
  return false;
}
function onNetClose(token){
  if(token!==NET.token) return;
  NET.status='reconnecting'; renderLobby(); updateUI();
  setTimeout(async()=>{
    if(token!==NET.token) return;
    const ok=await openLink(token);
    if(token!==NET.token) return;
    if(ok){ NET.status='online'; sendHello(); renderLobby(); updateUI(); } else onNetClose(token);
  },3000);
}
async function joinRoom(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  if(code.length<3){ netNote('اكتب رمز الغرفة (3 أحرف أو أكثر)'); return; }
  leaveRoom(true);
  S.name=($('#sName').value||S.name).trim().slice(0,14)||S.name; saveS();
  const token=++NET.token;
  NET.room=code; NET.status='connecting'; NET.joined=Date.now(); NET.peers=new Map(); NET.scores={}; NET.names={};
  NET.round=0; NET.active=false; NET.winSent=false;
  G.mode='online'; resetRound(null); $('#inp').value='';
  renderLobby(); updateUI();
  const ok=await openLink(token);
  if(token!==NET.token) return;
  if(!ok){ NET.status='failed'; renderLobby(); return; }
  NET.status='online';
  sendHello();
  clearInterval(NET.timer);
  NET.timer=setInterval(netTick,8000);
  clearInterval(NET.tt); NET.tt=setInterval(turnTick,250);
  setTimeout(()=>{ if(token===NET.token){ renderLobby(); updateUI(); } },2500);
  renderLobby(); updateUI();
}
function leaveRoom(silent){
  if(NET.mq){ try{ netSend({t:'bye',id:NET.id}); }catch(e){} try{ NET.mq.close(); }catch(e){} }
  NET.mq=null; NET.room=null; NET.status='off'; NET.token++; clearInterval(NET.timer); clearInterval(NET.tt); NET.active=false; NET.turn={k:0,id:null,last:null,dl:0,at:0};
  if(!silent){ G.mode='solo'; newSolo(); renderLobby(); updateUI(); }
}
function netTick(){
  if(NET.status!=='online') return;
  sendPing();
  const now=Date.now();
  NET.peers.forEach((p,id)=>{ if(id!==NET.id&&now-p.seen>60000) NET.peers.delete(id); });
  hostDuty();
  renderLobby(); updateUI();
}
function hostDuty(){
  if(!amHost()||!NET.active||NET.winSent) return;
  const tg=G.target; const g=G.guesses.find(x=>x.key===tg);
  if(g){ NET.winSent=true; netSend({t:'win',r:NET.round,id:g.by?g.by.id:NET.id,n:g.by?g.by.n:S.name}); }
}
function hostNextTurn(first){
  const order=alivePeers().sort((x,y)=>(x[1].joined-y[1].joined)||(x[0]<y[0]?-1:1)).map(x=>x[0]);
  if(!order.length) return;
  const cur=NET.turn.id||NET.turn.last;
  let idx=first?-1:order.indexOf(cur);
  if(!first&&idx<0){ // اللاعب الحالي طلع: ناخذ أول واحد
    idx=-1;
  }
  const id=order[(idx+1)%order.length];
  NET.lastTurnSend=Date.now();
  netSend({t:'turn',r:NET.round,k:NET.turn.k+1,id});
}
function turnTick(){
  renderTurn();
  if(!amHost()||!NET.active||NET.status!=='online') return;
  const t=NET.turn, now=Date.now();
  if(now-NET.lastTurnSend<1800) return;
  if(t.id){
    const alive=alivePeers().some(x=>x[0]===t.id);
    if(now>t.dl+1500||!alive) hostNextTurn(false);
  } else if(now-t.at>2500) hostNextTurn(false);
}
function hostStart(){
  if(!amHost()) { netNote('بس المضيف يقدر يبدي الجولة'); return; }
  netSend({t:'start',r:NET.round+1,tg:pickTarget()});
}
function hostGiveUp(){ if(amHost()&&NET.active) netSend({t:'giveup',r:NET.round}); }

function onNetMsg(topic,text){
  let m; try{ m=JSON.parse(text); }catch(e){ return; }
  if(!m||typeof m!=='object') return;
  switch(m.t){
    case 'hello':
      if(m.id===NET.id) return;
      touchPeer(m.id,m.n,m.j); sendPing();
      if(amHost()) netSend({t:'state',to:m.id,r:NET.round,tg:G.target,a:NET.active,
        g:G.guesses.map(x=>({c:x.key,id:x.by?x.by.id:'',n:x.by?x.by.n:''})),sc:NET.scores,nm:NET.names,ov:G.over,w:G.winner,tn:{k:NET.turn.k,id:NET.turn.id,l:Math.max(0,NET.turn.dl-Date.now())}});
      break;
    case 'ping': if(m.id!==NET.id) touchPeer(m.id,m.n,m.j); break;
    case 'bye': NET.peers.delete(m.id); break;
    case 'state':
      if(m.to!==NET.id||amHost()&&NET.round>=m.r&&NET.active) return;
      if(!(m.r>=NET.round)) return;
      NET.round=m.r; NET.active=!!m.a; NET.winSent=false;
      NET.scores=m.sc&&typeof m.sc==='object'?m.sc:{}; if(m.nm&&typeof m.nm==='object') Object.assign(NET.names,m.nm);
      resetRound(m.tg&&byKey[m.tg]?m.tg:null);
      if(m.tn&&typeof m.tn==='object') NET.turn={k:Number(m.tn.k)||0,id:m.tn.id?String(m.tn.id):null,last:m.tn.id?String(m.tn.id):null,dl:Date.now()+(Number(m.tn.l)||0),at:Date.now()};
      (Array.isArray(m.g)?m.g:[]).forEach(x=>{ const c=byKey[x.c]; if(c&&G.target&&!guessMap.has(c.key)){ const d=distKm(c,byKey[G.target]); G.guesses.push({key:c.key,d,by:x.id?{id:x.id,n:x.n}:null}); guessMap.set(c.key,d); } });
      if(m.ov){ G.over=true; G.revealed=!!G.target; netShowEnd(m.w); }
      renderList(); draw(); updateUI(); renderLobby();
      break;
    case 'start':
      if(!(m.r>NET.round)||!byKey[m.tg]) return;
      NET.round=m.r; NET.active=true; NET.winSent=false;
      NET.turn={k:0,id:null,last:null,dl:0,at:Date.now()};
      resetRound(m.tg); setMsg('بدت جولة جديدة! كل واحد عنده تخمين بدوره (15 ثانية) 🏁',true);
      if(amHost()) hostNextTurn(true);
      renderLobby(); updateUI(); $('#inp').focus&&0;
      break;
    case 'turn':
      if(m.r!==NET.round||!NET.active||!(m.k>NET.turn.k)) return;
      NET.turn={k:m.k,id:String(m.id),last:String(m.id),dl:Date.now()+TURN_MS,at:Date.now()};
      renderTurn(); break;
    case 'guess': {
      if(m.r!==NET.round||!NET.active) return;
      if(m.k!==NET.turn.k||m.id!==NET.turn.id) return;
      const c=byKey[m.c]; if(!c||guessMap.has(c.key)) return;
      touchPeer(m.id,m.n);
      const by={id:String(m.id),n:String(m.n||'لاعب').slice(0,14)};
      NET.turn.last=NET.turn.id; NET.turn.id=null; NET.turn.at=Date.now();
      const d=addGuess(c,by);
      if(m.id!==NET.id) setMsg(by.n+' خمّن '+c.ar+' ('+fmtDist(d)+')',true);
      if(amHost()&&c.key===G.target&&!NET.winSent){ NET.winSent=true; netSend({t:'win',r:NET.round,id:by.id,n:by.n}); }
      else if(amHost()&&c.key!==G.target) hostNextTurn(false);
      break; }
    case 'win':
      if(m.r!==NET.round||!NET.active) return;
      NET.active=false; NET.turn.id=null; G.over=true; G.revealed=true; G.winner={id:m.id,n:String(m.n||'لاعب').slice(0,14)};
      NET.scores[m.id]=(NET.scores[m.id]||0)+1; NET.names[m.id]=G.winner.n;
      netShowEnd(G.winner); draw(); updateUI(); renderLobby();
      break;
    case 'giveup':
      if(m.r!==NET.round||!NET.active) return;
      NET.active=false; NET.turn.id=null; G.over=true; G.revealed=true; G.winner=null; netShowEnd(null);
      if(G.target) flyTo(byKey[G.target].cen[0],byKey[G.target].cen[1]);
      draw(); updateUI(); renderLobby();
      break;
  }
}
function netShowEnd(w){
  const c=G.target?byKey[G.target]:null; if(!c) return;
  const btns=amHost()?[el('button',{class:'btn',onclick:hostStart,text:'جولة جديدة'})]:[];
  if(w) showBanner('🏆 '+w.n+(w.id===NET.id?' (إنت)':'')+' فاز!','الدولة: '+c.ar+' '+flag(c.a2),btns);
  else showBanner('الدولة كانت: '+c.ar+' '+flag(c.a2),'',btns);
}
function netNote(t){ const n=$('#netNote'); if(n) n.textContent=t; else setMsg(t); }

function renderRoomBar(){
  const rb=$('#roomBar'); if(G.mode!=='online'){ rb.hidden=true; return; }
  rb.hidden=false;
  const peers=alivePeers();
  const st=NET.status==='online'?'':(NET.status==='reconnecting'?' · ⚠️ جاري إعادة الاتصال':(NET.status==='connecting'?' · جاري الاتصال…':' · ❌ فشل الاتصال'));
  const chips=peers.map(([id,p])=>el('span',{class:'chip',style:'background:'+plColor(id)},(id===hostId()?'👑 ':'')+p.name+' · '+(NET.scores[id]||0)));
  rb.replaceChildren(el('div',{class:'t',text:'🌐 غرفة '+NET.room+' · '+peers.length+' لاعب'+st}),el('div',{class:'chips'},chips));
}
function renderLobby(){
  if(G.mode==='online') renderRoomBar();
  const body=$('#netBody'); if(!body||$('#mNet').hidden) return;
  body.replaceChildren();
  if(!NET.room){
    body.append(
      el('div',{class:'sub',text:'العب مع أصدقائك: الكل يشوف نفس الكوكب ونفس التخمينات، وأول واحد يلكي الدولة يفوز. السيرفرات عامة ومجانية (EMQX).'}),
      el('div',{class:'sub',text:'اسمك'}),
      el('input',{type:'text',id:'nName',maxlength:'14',value:S.name}),
      el('div',{class:'sub',style:'margin-top:14px',text:'رمز الغرفة (اكتب رمز صديقك أو سوّي غرفة جديدة)'}),
      el('input',{type:'text',id:'nCode',maxlength:'8',class:'ltr',style:'text-transform:uppercase;text-align:center;font-size:24px;letter-spacing:4px',autocomplete:'off'}),
      el('div',{class:'fr'},
        el('button',{class:'btn',onclick:()=>{ S.name=($('#nName').value||S.name).trim().slice(0,14); $('#sName').value=S.name; saveS(); joinRoom($('#nCode').value); },text:'دخول'}),
        el('button',{class:'btn alt',onclick:()=>{ const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<5;i++) c+=a[Math.floor(Math.random()*a.length)]; $('#nCode').value=c; },text:'رمز عشوائي'})),
      el('div',{id:'netNote',class:'sub',style:'color:#a33'})
    );
    return;
  }
  const peers=alivePeers().sort((x,y)=>(x[1].joined-y[1].joined));
  const statusTxt={connecting:'جاري الاتصال بالسيرفر…',online:'متصل ✅ ('+NET.srv+')',reconnecting:'انقطع الاتصال، جاري المحاولة…',failed:'ما قدرت أتصل بأي سيرفر ❌ (تأكد من الإنترنت أو غيّر السيرفر من الإعدادات)'}[NET.status]||'';
  body.append(
    el('div',{class:'sub',text:'رمز الغرفة (دوس للنسخ)'}),
    el('div',{class:'code',onclick:()=>{ try{ navigator.clipboard.writeText(NET.room); netNote('اننسخ ✅'); }catch(e){} },text:NET.room}),
    el('div',{class:'sub',text:statusTxt}),
    el('div',{style:'font-weight:800;margin-top:6px',text:'اللاعبين ('+peers.length+')'}),
    peers.map(([id,p])=>el('div',{class:'pl'},el('span',{class:'chip',style:'background:'+plColor(id)},p.name),id===hostId()?'👑 المضيف':'',id===NET.id?'(إنت)':'',el('span',{class:'sc',text:String(NET.scores[id]||0)}))),
  );
  const fr=el('div',{class:'fr'});
  if(NET.status==='online'){
    if(amHost()){
      if(!NET.active) fr.append(el('button',{class:'btn',onclick:()=>{ hostStart(); $('#mNet').hidden=true; },text:G.over||NET.round>0?'جولة جديدة':'ابدأ اللعبة'}));
      else fr.append(el('button',{class:'btn red',onclick:()=>{ hostGiveUp(); $('#mNet').hidden=true; },text:'تخطي الجولة'}));
    } else fr.append(el('div',{class:'sub',text:NET.active?'الجولة شغالة… خمّن!':'بانتظار المضيف يبدي الجولة…'}));
  }
  fr.append(el('button',{class:'btn alt',onclick:()=>{ leaveRoom(false); },text:'خروج من الغرفة'}));
  body.append(fr,el('div',{id:'netNote',class:'sub'}));
}

/* ====================== نوافذ ====================== */

  m.addEventListener('click',e=>{ if(e.target===m||e.target.classList.contains('x')) m.hidden=true; });
});

$('#zOut').onclick=()=>setZoom(view.zoom/1.4);

document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&NET.room&&NET.status==='online'&&NET.mq&&NET.mq.ws&&NET.mq.ws.readyState!==1) onNetClose(NET.token); });

/* ====================== تحميل الخريطة ====================== */
async function loadTopo(){
  try{ const c=localStorage.getItem('gbl_topo_v1'); if(c) return JSON.parse(c); }catch(e){}
  for(const u of TOPO_URLS){
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),30000);
      const r=await fetch(u,{signal:ctl.signal}); clearTimeout(to);
      if(!r.ok) continue;
      const txt=await r.text(); const j=JSON.parse(txt);
      if(u.indexOf('50m')>0){ try{ localStorage.setItem('gbl_topo_v1',txt); }catch(e){} }
      return j;
    }catch(e){}
  }
  throw new Error('load');
}
async function init(){
  resize();
  const ld=$('#loading');
  ld.replaceChildren(el('div',{class:'spin'}),el('div',{text:'جاري تحميل الخريطة…'}));
  try{
    const topo=await loadTopo();
    buildCountries(topo); buildNameIndex(); loaded=true;
    ld.hidden=true; ld.style.display='none';
    newSolo();
  }catch(e){
    ld.replaceChildren(el('div',{text:'ما كدرت أحمّل الخريطة. تأكد من الإنترنت.'}),el('button',{onclick:init,text:'إعادة المحاولة'}));
  }
}
init();
})();
