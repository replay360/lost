<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Buzz للدردشة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #ff5722;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #ccc;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2c2c2c;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #ff5722;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.3s, opacity 0.3s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-signup {
            background-color: #ff5722;
            color: white;
        }
        .btn-signup:hover:not(:disabled) {
            background-color: #e64a19;
        }
        .btn-login {
            background-color: #2196F3;
            color: white;
        }
        .btn-login:hover:not(:disabled) {
            background-color: #1976D2;
        }
        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .alert-error {
            background-color: #5a1e1e;
            color: #ff8a8a;
            border: 1px solid #882222;
        }
        .alert-success {
            background-color: #1e4a23;
            color: #8aff9e;
            border: 1px solid #228833;
        }
        
        /* تصميم شاشة الدردشة العامة */
        #chatScreen {
            display: none;
            text-align: right;
        }
        .chat-box {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            height: 320px;
            padding: 12px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-bubble {
            background-color: #383838;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            word-break: break-word;
        }
        .message-bubble.mine {
            background-color: #1e4a7a;
            align-self: flex-start;
        }
        .message-bubble.other {
            background-color: #2e3b2b;
            align-self: flex-end;
        }
        .sender-name {
            font-size: 11px;
            color: #ff9800;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .message-text {
            font-size: 14px;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            margin: 0;
            flex: 1;
        }
        .chat-input-area button {
            margin: 0;
            width: 90px;
            background-color: #ff5722;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. شاشة تسجيل الدخول وإنشاء الحساب -->
        <div class="card" id="authCard">
            <h2>تطبيق Buzz ⚡</h2>
            
            <div id="alertBox" class="alert"></div>

            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@mail.com">
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="6 أحرف أو أرقام على الأقل">
            </div>

            <button id="loginBtn" class="btn-login">تسجيل الدخول</button>
            <button id="signupBtn" class="btn-signup">إنشاء حساب جديد</button>
        </div>

        <!-- 2. شاشة غرفة الدردشة العامة -->
        <div class="card" id="chatScreen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0; font-size: 20px;">الدردشة العامة 💬</h2>
                <button id="logoutBtn" style="width: auto; padding: 6px 12px; margin: 0; background-color: #d32f2f; font-size: 13px;">خروج</button>
            </div>
            
            <p id="userWelcome" style="color: #aaa; font-size: 12px; margin-top: 0; margin-bottom: 10px;"></p>
            
            <!-- صندوق عرض الرسائل حياً -->
            <div class="chat-box" id="chatBox">
                <div style="text-align: center; color: #888; font-size: 13px;">جاري تحميل الرسائل...</div>
            </div>

            <!-- إرسال رسالة -->
            <form id="chatForm" class="chat-input-area">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                <button type="submit" id="sendBtn">إرسال</button>
            </form>
        </div>
    </div>

    <!-- كود الربط والمنطق البرمجي مع الفايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyDUXP5zndjshNQhvEhTSmoS0mqBiWjp0Kc",
            authDomain: "buzz-52d7e.firebaseapp.com",
            projectId: "buzz-52d7e",
            storageBucket: "buzz-52d7e.firebasestorage.app",
            messagingSenderId: "14074681805",
            appId: "1:14074681805:web:97dc13cc92089989e24c84"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // عناصر الواجهة
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const alertBox = document.getElementById('alertBox');
        
        const authCard = document.getElementById('authCard');
        const chatScreen = document.getElementById('chatScreen');
        const userWelcome = document.getElementById('userWelcome');
        const logoutBtn = document.getElementById('logoutBtn');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const chatBox = document.getElementById('chatBox');

        let currentUser = null;
        let unsubscribeMessages = null;

        function showAlert(message, isError = true) {
            alertBox.style.display = 'block';
            alertBox.textContent = message;
            alertBox.className = isError ? 'alert alert-error' : 'alert alert-success';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
        }

        function setLoading(loading) {
            loginBtn.disabled = loading;
            signupBtn.disabled = loading;
            loginBtn.textContent = loading ? 'جاري المعالجة...' : 'تسجيل الدخول';
            signupBtn.textContent = loading ? 'جاري المعالجة...' : 'إنشاء حساب جديد';
        }

        function handleAuthError(error) {
            console.error(error);
            switch (error.code) {
                case 'auth/email-already-in-use':
                    showAlert('هذا البريد مستخدم بالفعل! سجل دخول به.');
                    break;
                case 'auth/invalid-email':
                    showAlert('صيغة البريد الإلكتروني غير صحيحة.');
                    break;
                case 'auth/weak-password':
                    showAlert('كلمة المرور ضعيفة (6 خانات على الأقل).');
                    break;
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    showAlert('البريد الإلكتروني أو كلمة المرور غير صحيحة.');
                    break;
                case 'auth/quota-exceeded':
                case 'auth/too-many-requests':
                    showAlert('تم حظر المحاولات مؤقتاً. انتظر دقيقة وجرب مجدداً.');
                    break;
                default:
                    showAlert('حدث خطأ: ' + error.message);
            }
        }

        // الانتقال لشاشة الدردشة واستماع الرسائل الحية
        function goToChat(user) {
            currentUser = user;
            authCard.style.display = 'none';
            chatScreen.style.display = 'block';
            userWelcome.textContent = "المستخدم الحالی: " + user.email;
            
            loadRealtimeMessages();
        }

        // جلب الرسائل من Firestore وتحديثها لحظياً
        function loadRealtimeMessages() {
            const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = '';
                if (snapshot.empty) {
                    chatBox.innerHTML = '<div style="text-align: center; color: #888; font-size: 13px;">لا توجد رسائل بعد.. كن أول من يرسل!</div>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMine = data.senderId === currentUser.uid;

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message-bubble ${isMine ? 'mine' : 'other'}`;
                    
                    const senderName = document.createElement('div');
                    senderName.className = 'sender-name';
                    senderName.textContent = isMine ? 'أنت' : (data.senderEmail ? data.senderEmail.split('@')[0] : 'مستخدم');

                    const msgText = document.createElement('div');
                    msgText.className = 'message-text';
                    msgText.textContent = data.text;

                    msgDiv.appendChild(senderName);
                    msgDiv.appendChild(msgText);
                    chatBox.appendChild(msgDiv);
                });

                chatBox.scrollTop = chatBox.scrollHeight;
            }, (error) => {
                console.error("خطأ جلب الرسائل:", error);
                chatBox.innerHTML = '<div style="text-align: center; color: #f44336; font-size: 13px;">خطأ في الصلاحيات أو الاتصال بقاعدة البيانات!</div>';
            });
        }

        // إرسال رسالة جديدة
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            messageInput.value = '';

            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    senderId: currentUser.uid,
                    senderEmail: currentUser.email,
                    createdAt: serverTimestamp()
                });
            } catch (error) {
                console.error("خطأ الإرسال:", error);
                alert("تعذر إرسال الرسالة: " + error.message);
            }
        });

        // تسجيل الدخول
        loginBtn.addEventListener('click', async () => {
            hideAlert();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showAlert('يرجى إدخال البريد وكلمة المرور.');
                return;
            }

            setLoading(true);
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                goToChat(userCredential.user);
            } catch (error) {
                handleAuthError(error);
            } finally {
                setLoading(false);
            }
        });

        // إنشاء حساب جديد
        signupBtn.addEventListener('click', async () => {
            hideAlert();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showAlert('يرجى إدخال البريد وكلمة المرور.');
                return;
            }

            if (password.length < 6) {
                showAlert('كلمة المرور يجب أن تكون 6 خانات على الأقل.');
                return;
            }

            setLoading(true);
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                goToChat(userCredential.user);
            } catch (error) {
                handleAuthError(error);
            } finally {
                setLoading(false);
            }
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            if (unsubscribeMessages) unsubscribeMessages();
            await signOut(auth);
            chatScreen.style.display = 'none';
            authCard.style.display = 'block';
            passwordInput.value = '';
            hideAlert();
        });
    </script>
</body>
</html>
