<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة X-O أونلاين</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0d1117; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; text-align: center; width: 90%; max-width: 350px; }
    h1 { color: #58a6ff; margin-bottom: 10px; }
    .status { margin: 15px 0; font-weight: bold; color: #e3b341; }
    .inputs { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; text-align: center; }
    button { padding: 10px 15px; border-radius: 8px; border: none; background: #238636; color: #fff; font-weight: bold; cursor: pointer; }
    .btn-join { background: #1f6beb; }
    
    /* شبكة اللعبة */
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
    .cell { width: 80px; height: 80px; background: #21262d; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: pointer; border: 1px solid #30363d; }
    .cell.X { color: #58a6ff; }
    .cell.O { color: #f85149; }
  </style>
</head>
<body>

  <div class="card">
    <h1>❌ X - O ⭕</h1>
    <div id="status" class="status">اختر إنشاء غرفة أو ادخل كود للانضمام</div>

    <div class="inputs" id="setupBox">
      <input type="text" id="roomCode" placeholder="رمز الغرفة...">
      <button class="btn-join" onclick="joinRoom()">انضمام</button>
      <button onclick="createRoom()">إنشاء</button>
    </div>

    <div class="board" id="board" style="display: none;">
      <div class="cell" onclick="cellClicked(0)"></div>
      <div class="cell" onclick="cellClicked(1)"></div>
      <div class="cell" onclick="cellClicked(2)"></div>
      <div class="cell" onclick="cellClicked(3)"></div>
      <div class="cell" onclick="cellClicked(4)"></div>
      <div class="cell" onclick="cellClicked(5)"></div>
      <div class="cell" onclick="cellClicked(6)"></div>
      <div class="cell" onclick="cellClicked(7)"></div>
      <div class="cell" onclick="cellClicked(8)"></div>
    </div>
  </div>

  <script>
    const SERVER_URL = "http://192.168.0.176:3000";
    const socket = io(SERVER_URL);

    let mySymbol = null;
    let currentRoom = null;
    let myTurn = false;

    socket.on('connect', () => {
      document.getElementById('status').innerText = "🟢 متصل بالسيرفر المحلي!";
    });

    socket.on('roomCreated', (data) => {
      currentRoom = data.roomId;
      mySymbol = data.symbol;
      document.getElementById('status').innerText = `✅ كود الغرفة: ${currentRoom}\nأنت اللاعب (${mySymbol}) - بانتظار الخصم...`;
    });

    socket.on('gameStart', (data) => {
      currentRoom = data.roomId;
      document.getElementById('setupBox').style.display = 'none';
      document.getElementById('board').style.display = 'grid';
      
      const me = data.players.find(p => p.id === socket.id);
      mySymbol = me.symbol;
      myTurn = (data.turn === mySymbol);
      
      updateTurnStatus();
    });

    socket.on('moveMade', (data) => {
      // تحديث الشكل
      const cells = document.querySelectorAll('.cell');
      data.board.forEach((val, idx) => {
        cells[idx].innerText = val || '';
        cells[idx].className = `cell ${val || ''}`;
      });

      if (data.winner) {
        document.getElementById('status').innerText = data.winner === mySymbol ? "🎉 مبروك! فزت باللعبة!" : "❌ خسرت! الفوز للخصم.";
        myTurn = false;
        return;
      }

      if (data.isDraw) {
        document.getElementById('status').innerText = "🤝 تعادل!";
        myTurn = false;
        return;
      }

      myTurn = (data.nextTurn === mySymbol);
      updateTurnStatus();
    });

    socket.on('errorMsg', (msg) => alert(msg));

    function createRoom() {
      socket.emit('createRoom');
    }

    function joinRoom() {
      const code = document.getElementById('roomCode').value.trim().toUpperCase();
      if (code) socket.emit('joinRoom', code);
    }

    function cellClicked(index) {
      if (!myTurn) {
        alert("مو دورك!");
        return;
      }
      socket.emit('makeMove', { roomId: currentRoom, index });
    }

    function updateTurnStatus() {
      document.getElementById('status').innerText = myTurn ? `🟢 دورك الآن (${mySymbol})` : `⏳ دور الخصم...`;
    }
  </script>
</body>
</html>
